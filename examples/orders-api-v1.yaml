openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      summary: Create an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
    delete:
      summary: Cancel an order
      responses:
        "204":
          description: Cancelled
  /legacy/export:
    get:
      summary: CSV export
      responses:
        "200":
          description: CSV file
components:
  schemas:
    Order:
      type: object
      required: [id, total]
      properties:
        id:
          type: string
        requestId:
          type: string
          description: Correlation id of the call that created the order
          format: uuid
        total:
          type: number
        note:
          type: string
    NewOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
        coupon:
          type: string
