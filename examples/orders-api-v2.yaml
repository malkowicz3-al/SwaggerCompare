openapi: 3.0.3
info:
  title: Orders API
  version: 2.0.0
servers:
  - url: https://api.example.com/v2
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "429":
          description: Too many requests
    post:
      summary: Create an order
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created
  /orders/{id}:
    get:
      summary: Get one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
    patch:
      summary: Update an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
components:
  schemas:
    Order:
      type: object
      required: [id, total, currency]
      properties:
        id:
          type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
        total:
          type: number
        currency:
          type: string
    RequestId:
      type: string
      description: Correlation id of the call that created the order
      format: uuid-v7
    NewOrder:
      type: object
      required: [items, currency]
      properties:
        items:
          type: array
          items:
            type: string
        currency:
          type: string
