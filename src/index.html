<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>SwaggerCompare</title>
<!-- relative paths: same files run from app:// (Electron) and file:// (SwaggerCompare.bat) -->
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/400.css">
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/500.css">
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/600.css">
<link rel="stylesheet" href="../vendor/fonts/jetbrains-mono/400.css">
<link rel="stylesheet" href="../vendor/fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="titlebar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h7M4 12h5M4 18h7" /><path d="M13 6h7M15 12h5M13 18h7" /></svg>
    <span>SwaggerCompare</span>
  </div>
</header>

<main class="workspace">
  <section class="diff">
    <div class="panes">
      <div class="pane-head" data-side="left">
        <div class="pane-id">
          <span class="pane-name">Original</span>
          <span class="pane-file" id="file-left">Empty</span>
        </div>
        <span class="spec" id="spec-left" hidden></span>
        <div class="pane-actions">
          <button class="icon" data-open="left" title="Open file"><svg viewBox="0 0 24 24"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18V9.5A1.5 1.5 0 0 0 18.5 8h-7l-2-2.5h-4A1.5 1.5 0 0 0 4 7Z"/></svg></button>
          <button class="icon" data-clear="left" title="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <button id="swap" class="swap" title="Swap original and modified"><svg viewBox="0 0 24 24"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg></button>
      <div class="pane-head" data-side="right">
        <div class="pane-id">
          <span class="pane-name">Modified</span>
          <span class="pane-file" id="file-right">Empty</span>
        </div>
        <span class="spec" id="spec-right" hidden></span>
        <div class="pane-actions">
          <button class="icon" data-open="right" title="Open file"><svg viewBox="0 0 24 24"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18V9.5A1.5 1.5 0 0 0 18.5 8h-7l-2-2.5h-4A1.5 1.5 0 0 0 4 7Z"/></svg></button>
          <button class="icon" data-clear="right" title="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
    </div>
    <div id="editor"></div>
    <input type="file" id="file-input" accept=".yaml,.yml,.json,application/json,text/yaml" hidden>
  </section>

  <aside class="changes" aria-label="Changes">
    <div class="changes-head">
      <h2>Changes <span id="total"></span></h2>
      <div class="filters" id="filters" hidden>
        <button class="chip added" data-kind="added" aria-pressed="true" title="Show added"><span>+</span><b id="n-added">0</b></button>
        <button class="chip removed" data-kind="removed" aria-pressed="true" title="Show removed"><span>−</span><b id="n-removed">0</b></button>
        <button class="chip changed" data-kind="changed" aria-pressed="true" title="Show changed"><span>~</span><b id="n-changed">0</b></button>
      </div>
    </div>
    <div class="search" id="search-wrap" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="search" type="search" placeholder="Filter by endpoint, schema or field" spellcheck="false">
    </div>
    <div class="state" id="state" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2M12 8v8M8 12h8"/></svg>
      <p class="state-title">Two specs, one list of changes</p>
      <p class="state-text">Paste or drop a Swagger or OpenAPI file into each editor. Changes appear here as you type.</p>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
</main>

<script src="../vendor/monaco/vs/loader.js"></script>
<script src="gen/renderer.js"></script>
</body>
</html>
