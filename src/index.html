<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>SwaggerCompare</title>
<!-- relative paths: same files run from app:// (Electron) and file:// (SwaggerCompare.bat) -->
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/400.css">
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/500.css">
<link rel="stylesheet" href="../vendor/fonts/ibm-plex-sans/600.css">
<link rel="stylesheet" href="../vendor/fonts/jetbrains-mono/400.css">
<link rel="stylesheet" href="../vendor/fonts/jetbrains-mono/500.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
<header class="titlebar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6M4 12h4M4 18h6" /><path d="M14 6h6M16 12h4M14 18h6" /></svg>
    <span>SwaggerCompare</span>
  </div>
  <div class="versions" id="versions" hidden></div>
  <div class="seg" id="mode" role="group" aria-label="Mode">
    <button type="button" data-mode="compare" aria-pressed="true">Compare</button>
    <button type="button" data-mode="edit" aria-pressed="false">Edit</button>
  </div>
</header>

<main class="workspace">
  <section class="diff">
    <div class="panes">
      <div class="pane-head" data-side="left">
        <div class="pane-id">
          <span class="pane-name">Original <span class="pane-file" id="file-left">Empty</span></span>
          <span class="pane-title" id="title-left" hidden></span>
        </div>
        <span class="spec" id="spec-left" hidden></span>
        <div class="pane-actions">
          <button class="icon" data-open="left" title="Open file"><svg viewBox="0 0 24 24"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18V9.5A1.5 1.5 0 0 0 18.5 8h-7l-2-2.5h-4A1.5 1.5 0 0 0 4 7Z"/></svg></button>
          <button class="icon" data-clear="left" title="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <button id="swap" class="swap" title="Swap original and modified"><svg viewBox="0 0 24 24"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg></button>
      <div class="pane-head" data-side="right">
        <div class="pane-id">
          <span class="pane-name">Modified <span class="pane-file" id="file-right">Empty</span></span>
          <span class="pane-title" id="title-right" hidden></span>
        </div>
        <span class="spec" id="spec-right" hidden></span>
        <div class="pane-actions">
          <button class="icon" data-open="right" title="Open file"><svg viewBox="0 0 24 24"><path d="M4 7.5V18a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18V9.5A1.5 1.5 0 0 0 18.5 8h-7l-2-2.5h-4A1.5 1.5 0 0 0 4 7Z"/></svg></button>
          <button class="icon" data-clear="right" title="Clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
    </div>
    <div id="editor"></div>
    <input type="file" id="file-input" accept=".yaml,.yml,.json,application/json,text/yaml" hidden>
  </section>

  <aside class="changes" aria-label="Changes">
    <div class="changes-head">
      <h2>Changes <span id="total"></span></h2>
      <div class="nav" id="nav" hidden>
        <button id="prev" class="icon" aria-label="Previous change (Shift+F8)" title="Previous change (Shift+F8)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
        <span id="pos" aria-live="polite">– / 0</span>
        <button id="next" class="icon" aria-label="Next change (F8)" title="Next change (F8)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="filters" id="filters" hidden>
        <button class="chip added" data-kind="added" aria-pressed="true" title="Show added"><span>+</span><b id="n-added">0</b></button>
        <button class="chip removed" data-kind="removed" aria-pressed="true" title="Show removed"><span>−</span><b id="n-removed">0</b></button>
        <button class="chip changed" data-kind="changed" aria-pressed="true" title="Show changed"><span>~</span><b id="n-changed">0</b></button>
      </div>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <div class="seg" role="group" aria-label="Group changes by">
        <button type="button" data-view="objects" aria-pressed="true">Objects</button>
        <button type="button" data-view="endpoints" aria-pressed="false">Endpoints</button>
      </div>
      <button type="button" id="breaking" class="bchip" aria-pressed="false" title="Show only breaking changes">⚠ Breaking <b id="n-breaking">0</b></button>
      <button type="button" id="copy" class="tbtn" aria-live="polite" title="Copy a Markdown report of all changes">Copy report</button>
    </div>
    <p class="summary" id="summary" hidden></p>
    <div class="tagbar" id="tagbar" role="group" aria-label="Filter by tag" hidden>
      <button id="toggle-all" class="icon" type="button" title="Collapse all" aria-label="Collapse all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 11 5-5 5 5M7 18l5-5 5 5"/></svg></button>
    </div>
    <div class="search" id="search-wrap" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="search" type="search" placeholder="Filter by endpoint, schema or field" spellcheck="false">
    </div>
    <div class="state" id="state" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2M12 8v8M8 12h8"/></svg>
      <p class="state-title">Two specs, one list of changes</p>
      <p class="state-text">Paste or drop a Swagger or OpenAPI file into each editor. Changes appear here as you type.</p>
    </div>
    <ol class="list" id="list"></ol>
  </aside>

  <section class="edit" id="edit" hidden>
    <div class="edwrap">
      <div class="edbar">
        <select id="new-ver" aria-label="OpenAPI version for New"></select>
        <button type="button" class="tbtn" id="ed-new" title="Start a new spec from a template">New</button>
        <button type="button" class="tbtn" id="ed-open" title="Open a YAML or JSON file">Open</button>
        <button type="button" class="tbtn" id="ed-save" title="Download the spec">Save</button>
        <button type="button" class="tbtn" id="ed-format" title="Reformat the document">Format</button>
        <span class="pane-file" id="ed-file">Untitled</span>
        <span class="spec" id="ed-spec" hidden></span>
        <input type="file" id="edit-input" accept=".yaml,.yml,.json,application/json,text/yaml" hidden>
      </div>
      <div id="edit-editor"></div>
    </div>
    <aside class="side" aria-label="Outline and problems">
      <div class="tabs seg" role="tablist">
        <button type="button" role="tab" data-tab="outline" aria-selected="true">Outline</button>
        <button type="button" role="tab" data-tab="problems" aria-selected="false">Problems <b id="n-problems">0</b></button>
      </div>
      <div class="tabpane" id="tab-outline" role="tabpanel"><ul class="tree" id="outline"></ul></div>
      <div class="tabpane" id="tab-problems" role="tabpanel" hidden><ul class="tree" id="problems"></ul></div>
    </aside>
  </section>
</main>

<script src="../vendor/monaco/vs/loader.js"></script>
<script src="gen/renderer.js"></script>
</body>
</html>
