openapi: 3.0.3
info: {title: Shop, version: "1.0"}
paths:
  /pets:
    get:
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200": {description: ok}
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Pet"}
      responses:
        "201": {description: created}
  /pets/{id}:
    delete:
      responses:
        "204": {description: gone}
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        name: {type: string}
        tag: {type: string}
    Owner:
      type: object
