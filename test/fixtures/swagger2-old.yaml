swagger: "2.0"
info:
  title: Shop
  version: "1.0"
schemes: [http, https]
paths:
  /users:
    parameters:
      - {name: tenant, in: header, type: string, required: false}
    get:
      summary: List users
      parameters:
        - {name: limit, in: query, type: integer}
        - {name: legacy, in: query, type: string}
      responses:
        200: {description: ok}
        500: {description: error}
    delete:
      responses:
        204: {description: gone}
  /users/{id}:
    put:
      parameters:
        - name: body
          in: body
          required: false
          schema: {$ref: "#/definitions/User"}
      responses:
        200: {description: ok}
  /legacy:
    get:
      responses:
        200: {description: ok}
    post:
      responses:
        200: {description: ok}
definitions:
  User:
    required: [name, age]
    properties:
      name: {type: string}
      email: {type: string}
      age: {type: integer}
      nick: {type: string}
  Legacy:
    type: object
