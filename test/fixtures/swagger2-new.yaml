swagger: "2.0"
info:
  version: "1.1"
  title: Shop
schemes: [https]
paths:
  /users:
    parameters:
      - {name: tenant, in: header, type: string, required: true}
    get:
      summary: List users
      parameters:
        - {name: page, in: query, type: integer}
        - {name: limit, in: query, type: string}
      responses:
        200: {description: ok}
        404: {description: missing}
    post:
      responses:
        201: {description: created}
  /users/{id}:
    put:
      parameters:
        - name: body
          in: body
          required: true
          schema: {$ref: "#/definitions/Order"}
      responses:
        200: {description: ok}
  /orders:
    get:
      responses:
        200: {description: ok}
    post:
      responses:
        200: {description: ok}
definitions:
  User:
    required: [name, email]
    properties:
      name: {type: integer}
      email: {type: string}
      phone: {type: string}
      nick: {type: string, format: nickname}
  Order:
    type: object
